info:
  name: Get Notification History
  type: http
  seq: 2

http:
  method: GET
  url: "{{notify_url}}/api/audit"
  headers:
    - name: Remote-User
      value: "{{remote_user}}"
    - name: Remote-Groups
      value: "{{remote_groups}}"
  params:
    - name: notificationId
      value: "{{notification_id}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: Get Upcoming Runs
  type: http
  seq: 5

http:
  method: GET
  url: "{{notify_url}}/api/notifications/{{notification_id}}/upcoming"
  headers:
    - name: Remote-User
      value: "{{remote_user}}"
    - name: Remote-Groups
      value: "{{remote_groups}}"
  params:
    - name: count
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

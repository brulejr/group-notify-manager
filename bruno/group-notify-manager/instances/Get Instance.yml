info:
  name: Get Instance
  type: http
  seq: 3

http:
  method: GET
  url: "{{notify_url}}/api/instances/{{instance_id}}"
  headers:
    - name: Remote-User
      value: "{{remote_user}}"
    - name: Remote-Groups
      value: "{{remote_groups}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

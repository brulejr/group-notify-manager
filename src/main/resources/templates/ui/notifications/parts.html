<!DOCTYPE html>
<!--/* Pieces of the notification form that are fetched on their own: a delivery row, the
       schedule's next runs, and the body preview. Never rendered as a page. */-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* One delivery: which plugin, and an input for each field it asks for. */-->
<div th:fragment="delivery" class="card delivery-card" th:with="i=${row.index}, p=${row.plugin}">
  <input type="hidden" th:name="'deliveries[' + ${i} + '].plugin'" th:value="${p.id}">
  <input type="hidden" th:name="'deliveries[' + ${i} + '].id'" th:value="${row.id}">
  <div class="card-header delivery-header">
    <i class="bi plugin-icon" th:classappend="'bi-' + ${p.icon}"></i>
    <span class="fw-semibold" th:text="${p.name}">Discord</span>
    <span class="badge text-bg-warning" th:unless="${p.ready}" th:title="${p.reason}"><i class="bi bi-exclamation-triangle me-1"></i>not ready</span>
    <input class="form-control form-control-sm delivery-label" th:name="'deliveries[' + ${i} + '].label'" th:value="${row.label}"
           placeholder="Label (optional)" aria-label="Label" maxlength="100">
    <div class="form-check form-switch mb-0 ms-auto" title="A disabled delivery is kept but not sent">
      <input type="hidden" th:name="'deliveries[' + ${i} + '].enabled'" value="false">
      <input class="form-check-input" type="checkbox" role="switch" th:id="'d' + ${i} + '-enabled'" th:name="'deliveries[' + ${i} + '].enabled'"
             value="true" th:checked="${row.enabled}">
      <label class="form-check-label small" th:for="'d' + ${i} + '-enabled'">On</label>
    </div>
    <button type="button" class="btn btn-sm btn-outline-danger" data-remove-delivery title="Remove this delivery" aria-label="Remove"><i class="bi bi-x-lg"></i></button>
  </div>
  <div class="card-body">
    <div class="alert alert-danger py-2 small" th:if="${row.error != null}" th:text="${row.error}">error</div>
    <p class="small text-body-secondary" th:text="${p.description}">description</p>
    <div class="row g-3">
      <div th:each="in : ${row.inputs}" th:with="f=${in.field}"
           th:class="${f.type.name() == 'TEXTAREA' or f.type.name() == 'URL' or f.type.name() == 'EMAIL' or f.type.name() == 'PHONE'} ? 'col-12' : 'col-md-6'">
        <th:block th:if="${f.type.name() == 'CHECKBOX'}">
          <div class="form-check mt-md-4">
            <input type="hidden" th:name="${in.name}" value="false">
            <input class="form-check-input" type="checkbox" th:id="${in.inputId}" th:name="${in.name}" value="true"
                   th:checked="${in.value == 'true'}" th:classappend="${in.error != null} ? 'is-invalid'">
            <label class="form-check-label" th:for="${in.inputId}" th:text="${f.label}">label</label>
            <div class="invalid-feedback" th:text="${in.error}"></div>
          </div>
        </th:block>
        <th:block th:unless="${f.type.name() == 'CHECKBOX'}">
          <label class="form-label fw-semibold" th:for="${in.inputId}">
            <span th:text="${f.label}">label</span><span class="text-danger" th:if="${f.required}" title="required"> *</span>
            <i class="bi bi-lock ms-1 text-body-secondary small" th:if="${f.secret}" title="Kept secret: never shown again once saved"></i></label>
          <select th:if="${f.type.name() == 'SELECT'}" class="form-select" th:id="${in.inputId}" th:name="${in.name}"
                  th:classappend="${in.error != null} ? 'is-invalid'">
            <option th:each="o : ${f.options}" th:value="${o.value}" th:text="${o.label}" th:selected="${o.value == in.value}">option</option>
          </select>
          <textarea th:if="${f.type.name() == 'TEXTAREA'}" class="form-control" rows="3" th:id="${in.inputId}" th:name="${in.name}"
                    th:placeholder="${f.placeholder}" th:text="${in.value}" th:classappend="${in.error != null} ? 'is-invalid'"></textarea>
          <input th:if="${f.type.name() != 'SELECT' and f.type.name() != 'TEXTAREA'}" class="form-control" th:id="${in.inputId}" th:name="${in.name}"
                 th:type="${f.secret} ? 'password' : (${f.type.name() == 'NUMBER'} ? 'number' : (${f.type.name() == 'URL'} ? 'url' : 'text'))"
                 th:value="${in.value}" autocomplete="off"
                 th:placeholder="${in.saved} ? 'Saved — leave blank to keep it' : ${f.placeholder}"
                 th:classappend="${in.error != null} ? 'is-invalid'"
                 th:attr="inputmode=${f.type.name() == 'PHONE'} ? 'tel' : (${f.type.name() == 'EMAIL'} ? 'email' : null)">
          <div class="invalid-feedback" th:text="${in.error}"></div>
          <div class="form-text" th:if="${!#strings.isEmpty(f.help)}" th:text="${f.help}">help</div>
        </th:block>
      </div>
    </div>
  </div>
</div>

<!--/* The next few runs of the schedule as typed. */-->
<div th:fragment="schedulePreview" class="schedule-preview">
  <div class="text-body-secondary small" th:if="${problem != null}"><i class="bi bi-info-circle me-1"></i><span th:text="${problem}">problem</span></div>
  <th:block th:if="${!runs.isEmpty()}">
    <div class="small fw-semibold mb-1" th:text="${runs.size() == 1} ? 'Sent' : 'Next runs'">Next runs</div>
    <ol class="upcoming-runs mb-0">
      <li th:each="t : ${runs}" th:text="${#temporals.format(t.atZone(zone), 'EEE d MMM yyyy, h:mm a z')}">time</li>
    </ol>
  </th:block>
</div>

<!--/* The body as each kind of delivery gets it. */-->
<div th:fragment="preview" class="card preview-card">
  <div class="card-header py-2">
    <ul class="nav nav-tabs card-header-tabs" role="tablist">
      <li class="nav-item"><button class="nav-link active" type="button" data-bs-toggle="tab" data-bs-target="#preview-html">Email &amp; console</button></li>
      <li class="nav-item"><button class="nav-link" type="button" data-bs-toggle="tab" data-bs-target="#preview-md">Discord</button></li>
      <li class="nav-item"><button class="nav-link" type="button" data-bs-toggle="tab" data-bs-target="#preview-text">SMS &amp; text</button></li>
    </ul>
    <button type="button" class="btn-close ms-auto small" aria-label="Close preview" onclick="this.closest('.preview-card').remove()"></button>
  </div>
  <div class="card-body tab-content">
    <div class="tab-pane fade show active rendered" id="preview-html" th:utext="${html}">html</div>
    <pre class="tab-pane fade preview-plain" id="preview-md" th:text="${markdown}">md</pre>
    <pre class="tab-pane fade preview-plain" id="preview-text" th:text="${text}">text</pre>
  </div>
</div>
</body>
</html>

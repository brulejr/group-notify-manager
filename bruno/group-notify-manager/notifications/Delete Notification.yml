info:
  name: Delete Notification
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{notify_url}}/api/notifications/{{notification_id}}"
  headers:
    - name: Remote-User
      value: "{{remote_user}}"
    - name: Remote-Groups
      value: "{{remote_groups}}"
    - name: X-Requested-With
      value: bruno
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

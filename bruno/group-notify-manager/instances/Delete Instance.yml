info:
  name: Delete Instance
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{notify_url}}/api/instances/{{instance_id}}"
  headers:
    - name: Remote-User
      value: "{{remote_user}}"
    - name: Remote-Groups
      value: "{{remote_groups}}"
    - name: X-Requested-With
      value: bruno
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: Send Now
  type: http
  seq: 8

http:
  method: POST
  url: "{{notify_url}}/api/notifications/{{notification_id}}/send"
  headers:
    - name: Remote-User
      value: "{{remote_user}}"
    - name: Remote-Groups
      value: "{{remote_groups}}"
    - name: X-Requested-With
      value: bruno
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

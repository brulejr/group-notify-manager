# Copy to application-local.yml (gitignored, and left out of the boot jar) for
# development. The local profile is the default.

# Reads POSTGRES_* and the rest straight from .env, so `./gradlew bootRun` works without
# exporting them first.
spring.config.import: optional:file:.env[.properties]

notify:
  security:
    # Requests without Authelia's headers are signed in as this user, so the console
    # works on http://localhost:5002 without Traefik. Never set this in production.
    dev-user:
      username: devuser
      name: Dev User
      email: dev@example.org
      groups: [homelab_admins, notify_club, notify_family]
  groups:
    pattern: "notify_.*"
    names:
      notify_club: Radio Club
      notify_family: Family

# Mail goes to Mailpit (docker/dev: SMTP on 1025, its inbox on http://localhost:8025)
# unless .env names a real server: set MAIL_HOST, MAIL_PORT=587, MAIL_SMTP_AUTH=true,
# MAIL_STARTTLS=true, MAIL_USERNAME and MAIL_PASSWORD there to send for real.
spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

info:
  name: Get Failures
  type: http
  seq: 3

http:
  method: GET
  url: "{{notify_url}}/api/audit"
  headers:
    - name: Remote-User
      value: "{{remote_user}}"
    - name: Remote-Groups
      value: "{{remote_groups}}"
  params:
    - name: type
      value: "FAILED"
      type: query
    - name: type
      value: "SKIPPED"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
